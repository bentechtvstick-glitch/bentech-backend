<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Galaxy STB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Pòtal STB (MAG / TVIP): JavaScript ES5 sèlman, paske navigatè box sa yo ansyen. */
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
body.ui{background:#070b16}
#ui{position:absolute;left:0;top:0;right:0;bottom:0}
#top{position:absolute;left:4%;right:4%;top:3%;height:10%}
#logo{height:100%;max-width:30%}
#clock{position:absolute;right:0;top:20%;font-size:26px;font-weight:bold}
#who{position:absolute;right:0;top:62%;font-size:15px;color:#9fb0d0}
#groups{position:absolute;left:4%;top:17%;width:28%;bottom:6%;background:#101830;border-radius:10px;overflow:hidden}
#chans{position:absolute;left:34%;right:4%;top:17%;bottom:6%;background:#0c1326;border-radius:10px;overflow:hidden}
.row{height:44px;line-height:44px;padding:0 14px;font-size:19px;white-space:nowrap;overflow:hidden;border-bottom:1px solid #18223d}
.row .n{display:inline-block;width:62px;color:#8fa3c8}
.row img{height:30px;width:52px;vertical-align:middle;margin-right:10px}
.row.sel{background:#2f6bff}
.col.off .row.sel{background:#2a3a63}
.hd{height:38px;line-height:38px;padding:0 14px;font-size:15px;color:#9fb0d0;background:#0a1020;text-transform:uppercase;letter-spacing:1px}
#msg{position:absolute;left:10%;right:10%;top:30%;text-align:center;font-size:30px;line-height:1.4;display:none}
#msg small{display:block;font-size:20px;color:#a9b7d6;margin-top:18px}
#msg b{color:#ffd166}
#bar{position:absolute;left:4%;right:4%;bottom:5%;height:84px;background:rgba(6,10,22,.85);border-radius:12px;display:none}
#bar .num{position:absolute;left:24px;top:14px;font-size:42px;font-weight:bold;color:#7fb0ff}
#bar .nm{position:absolute;left:140px;top:16px;font-size:30px;font-weight:bold;right:200px;white-space:nowrap;overflow:hidden}
#bar .grp{position:absolute;left:140px;top:54px;font-size:16px;color:#a9b7d6}
#bar img{position:absolute;right:24px;top:12px;height:60px}
#err{position:absolute;left:30%;right:30%;top:42%;padding:18px;text-align:center;background:rgba(120,20,30,.9);border-radius:10px;font-size:20px;display:none}
video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;display:none}
</style>
</head>
<body class="ui">
<video id="vid"></video>
<div id="ui">
  <div id="top"><img id="logo" src="/galaxy/logo.png" alt=""><div id="clock"></div><div id="who"></div></div>
  <div id="groups" class="col"></div>
  <div id="chans" class="col off"></div>
  <div id="msg"></div>
</div>
<div id="bar"><div class="num"></div><div class="nm"></div><div class="grp"></div><img alt=""></div>
<div id="err"></div>
<script>
(function () {
  var stb = window.gSTB || window.stb || null;
  var ROWS = 0, data = null, groups = [], byGroup = {}, gi = 0, ci = 0, focus = "g", playing = null, playList = [], playIdx = 0, barT = 0, uiShown = true;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // ---- MAC box la ----
  function getMac() {
    var m = "";
    try { if (stb && stb.GetDeviceMacAddress) m = stb.GetDeviceMacAddress(); } catch (e) {}
    try { if (!m && stb && stb.RDir) m = stb.RDir("MACAddress"); } catch (e) {}
    var q = /[?&]mac=([0-9a-fA-F:\-]{12,17})/.exec(location.search);
    if (!m && q) m = q[1];
    return String(m || "").toUpperCase().replace(/-/g, ":");
  }
  var MAC = getMac();

  // ---- Lektè a ----
  try { if (stb) { stb.InitPlayer && stb.InitPlayer(); stb.SetPIG && stb.SetPIG(1, 0, 0, 0); stb.SetTopWin && stb.SetTopWin(0); } } catch (e) {}
  function play(ch) {
    playing = ch; hideErr();
    if (stb && stb.Play) { try { stb.Play("auto " + ch.url); } catch (e) { showErr("Play error"); } }
    else { var v = $("vid"); v.style.display = "block"; v.src = ch.url; try { v.play(); } catch (e) {} }
    showUi(false); showBar();
  }
  function stop() { try { if (stb && stb.Stop) stb.Stop(); } catch (e) {} var v = $("vid"); v.pause && v.pause(); v.style.display = "none"; playing = null; }

  // ---- Ekran ----
  function showUi(on) { uiShown = on; $("ui").style.display = on ? "block" : "none"; document.body.className = on ? "ui" : ""; if (on) { $("bar").style.display = "none"; render(); } }
  function showBar() {
    if (!playing) return;
    var b = $("bar"); b.querySelector(".num").innerHTML = esc(playing.num);
    b.querySelector(".nm").innerHTML = esc(playing.name);
    b.querySelector(".grp").innerHTML = esc(groupName(playing.group));
    var im = b.querySelector("img"); if (playing.logo) { im.src = playing.logo; im.style.display = "block"; } else im.style.display = "none";
    b.style.display = "block"; clearTimeout(barT); barT = setTimeout(function () { b.style.display = "none"; }, 4000);
  }
  function showErr(t) { var e = $("err"); e.innerHTML = esc(t); e.style.display = "block"; }
  function hideErr() { $("err").style.display = "none"; }
  function groupName(id) { for (var i = 0; i < groups.length; i++) if (groups[i].id === id) return groups[i].name; return ""; }
  function message(html) { var m = $("msg"); m.innerHTML = html; m.style.display = "block"; $("groups").style.display = "none"; $("chans").style.display = "none"; }

  function rows(el) { return Math.max(4, Math.floor((el.offsetHeight - 38) / 44)); }
  function list(el, title, items, sel, label) {
    var n = rows(el), start = Math.max(0, Math.min(sel - Math.floor(n / 2), items.length - n)); if (start < 0) start = 0;
    var h = '<div class="hd">' + esc(title) + "</div>";
    for (var i = start; i < Math.min(items.length, start + n); i++) h += '<div class="row' + (i === sel ? " sel" : "") + '">' + label(items[i]) + "</div>";
    el.innerHTML = h;
  }
  function render() {
    if (!data || data.state !== "active") return;
    $("groups").className = "col" + (focus === "g" ? "" : " off");
    $("chans").className = "col" + (focus === "c" ? "" : " off");
    list($("groups"), "Gwoup / Groups", groups, gi, function (g) { return esc(g.name) + ' <span style="color:#7f8fb0">(' + (byGroup[g.id] || []).length + ")</span>"; });
    var chs = groups[gi] ? byGroup[groups[gi].id] || [] : [];
    list($("chans"), groups[gi] ? groups[gi].name : "", chs, focus === "c" ? ci : -1, function (c) {
      return '<span class="n">' + esc(c.num) + "</span>" + (c.logo ? '<img src="' + esc(c.logo) + '" onerror="this.style.visibility=\'hidden\'">' : "") + esc(c.name);
    });
  }

  // ---- Done panel la ----
  function load() {
    if (!MAC) { message("MAC box la pa jwenn.<small>MAC address not found.</small>"); return; }
    var x = new XMLHttpRequest();
    x.open("GET", "/api/stb/portal?mac=" + encodeURIComponent(MAC) + "&t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (!j) { message("Pa ka konekte ak sèvè a.<small>Cannot reach the server. Retrying…</small>"); setTimeout(load, 15000); return; }
      apply(j);
    };
    x.send(null);
  }
  function apply(j) {
    data = j;
    $("logo").src = j.brand === "bentech" ? "/stb/bentech.png" : "/galaxy/logo.png";
    $("who").innerHTML = esc(j.customer && j.customer.name ? j.customer.name : MAC);
    if (j.state === "pending") { stop(); showUi(true); message("Box sa a poko aktive.<small>This box is not activated yet.<br><br>MAC: <b>" + esc(MAC) + "</b></small>"); setTimeout(load, 30000); return; }
    if (j.state === "expired") { stop(); showUi(true); message("Abònman ou fini.<small>Your subscription has ended.<br><br>MAC: <b>" + esc(MAC) + "</b></small>"); setTimeout(load, 60000); return; }
    if (j.state === "blocked") { stop(); showUi(true); message("Box sa a bloke.<small>This box is blocked.<br><br>MAC: <b>" + esc(MAC) + "</b></small>"); setTimeout(load, 60000); return; }
    if (j.state === "error") { message("Chanèl yo pa disponib kounye a.<small>" + esc(j.error || "") + "</small>"); setTimeout(load, 30000); return; }
    $("msg").style.display = "none"; $("groups").style.display = "block"; $("chans").style.display = "block";
    groups = j.groups || []; byGroup = {};
    var chs = j.channels || [];
    for (var i = 0; i < chs.length; i++) { var g = chs[i].group; (byGroup[g] || (byGroup[g] = [])).push(chs[i]); }
    var keep = []; for (i = 0; i < groups.length; i++) if (byGroup[groups[i].id]) keep.push(groups[i]); groups = keep;
    if (gi >= groups.length) gi = 0;
    if (uiShown) render();
    setTimeout(load, 10 * 60000);
  }

  // ---- Telekòmand ----
  var K = { UP: 38, DOWN: 40, LEFT: 37, RIGHT: 39, OK: 13, BACK: 8, EXIT: 27, CHUP: 33, CHDN: 34 };
  function zap(d) {
    if (!playList.length) return;
    playIdx = (playIdx + d + playList.length) % playList.length; play(playList[playIdx]);
  }
  document.onkeydown = function (e) {
    e = e || window.event; var k = e.keyCode;
    if (!data || data.state !== "active") return;
    if (!uiShown) {
      if (k === K.OK || k === K.BACK || k === K.EXIT || k === K.LEFT) { showUi(true); focus = "c"; render(); }
      else if (k === K.UP || k === K.CHUP) zap(-1);
      else if (k === K.DOWN || k === K.CHDN) zap(1);
      else showBar();
      e.preventDefault && e.preventDefault(); return false;
    }
    var chs = groups[gi] ? byGroup[groups[gi].id] || [] : [];
    if (focus === "g") {
      if (k === K.UP) gi = (gi - 1 + groups.length) % groups.length;
      else if (k === K.DOWN) gi = (gi + 1) % groups.length;
      else if (k === K.OK || k === K.RIGHT) { focus = "c"; ci = 0; }
      else if ((k === K.BACK || k === K.EXIT) && playing) { showUi(false); showBar(); }
    } else {
      if (k === K.UP) ci = Math.max(0, ci - 1);
      else if (k === K.DOWN) ci = Math.min(chs.length - 1, ci + 1);
      else if (k === K.CHUP) ci = Math.max(0, ci - 10);
      else if (k === K.CHDN) ci = Math.min(chs.length - 1, ci + 10);
      else if (k === K.LEFT || k === K.BACK || k === K.EXIT) focus = "g";
      else if (k === K.OK && chs[ci]) { playList = chs; playIdx = ci; play(chs[ci]); return false; }
    }
    render(); e.preventDefault && e.preventDefault(); return false;
  };

  function tick() { var d = new Date(), h = d.getHours(); $("clock").innerHTML = (h % 12 || 12) + ":" + pad(d.getMinutes()) + (h < 12 ? " AM" : " PM"); }
  tick(); setInterval(tick, 20000);
  load();
})();
</script>
</body>
</html>
