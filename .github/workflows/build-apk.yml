# Konstwi APK Galaxy TV Stick la otomatikman sou GitHub (pa bezwen Android Studio).
# Apre chak push (oswa "Run workflow" nan onglet Actions), telechaje APK a nan "Artifacts".
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # pou pibliye APK a nan "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      # Lè bati a echwe: mete erè yo kòm "annotations" pou yo ka li san telechaje jounal la
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |^w: .*deprecat|error:|ERROR|AAPT|What went wrong|^> |Unresolved|FAILED|Could not' build.log | grep -v '^w: \|^> Task\|Run with\|help.gradle' | sed "s#file://$GITHUB_WORKSPACE/##" | cut -c1-420 | awk '!seen[$0]++' > errs.txt || true
          [ -s errs.txt ] || tail -80 build.log > errs.txt
          split -l 14 errs.txt chunk_
          n=0
          for f in chunk_*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build errors $n::$msg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyTvStick-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Lyen piblik ki pa janm chanje, pou telechaje APK a sou Fire Stick la (app "Downloader"):
      # https://github.com/OWNER/REPO/releases/download/apk-latest/GalaxyTvStick.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/android-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GalaxyTvStick.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          sleep 3
          # Ti fichye vèsyon an: panel la li l pou konnen dènye vèsyon an (san limit API GitHub)
          echo "{\"build\": $GITHUB_RUN_NUMBER, \"version\": \"1.0.$GITHUB_RUN_NUMBER\"}" > version.json
          gh release create apk-latest GalaxyTvStick.apk version.json --target "$GITHUB_SHA" --prerelease \
            --title "Galaxy TV Stick APK (build $GITHUB_RUN_NUMBER)" \
            --notes "APK tès Galaxy TV Stick, bati otomatikman. Vèsyon 1.0.$GITHUB_RUN_NUMBER."
